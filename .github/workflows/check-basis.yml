name: Check Basis

on:
  pull_request:

jobs:
  no-basis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: Check for Basis
      run: |
        if grep -iR basis --exclude-dir=.github --exclude-dir=.git .; then
          exit 1
        else
          exit 0
        fi
