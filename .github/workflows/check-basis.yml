name: Check Basis

on:
  pull_request:

jobs:
  no-basis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for Basis
      run: |
        if grep -iR basis --exclude-dir=.github --exclude-dir=.git .; then
          exit 1
        else
          exit 0
        fi
