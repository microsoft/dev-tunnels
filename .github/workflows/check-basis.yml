name: Check Basis

on:
  pull_request:

jobs:
  no-basis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Check for Basis
      run: |
        if grep -iR basis --exclude-dir=.github --exclude-dir=.git .; then
          exit 1
        else
          exit 0
        fi
